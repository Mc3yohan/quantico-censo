name: Quantico Censo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sanitize-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Clean-Room Sanitization Gate
        run: python scripts/sanitize_check.py

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run Backend & Security Test Suite
        working-directory: backend
        run: pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Strict TypeScript Check & Dual Vite Build
        working-directory: frontend
        run: |
          npm run typecheck
          npm run build
          npm run build:docs

  docker-cqrs-postgis-e2e:
    runs-on: ubuntu-latest
    needs: [sanitize-and-backend, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install E2E verifier dependencies
        run: pip install httpx websockets

      - name: Boot Full CQRS Stack (PostGIS 15 + Redis 7 + Sync/Read FastAPI + Nginx)
        run: docker compose up -d --build --wait

      - name: Run Live CQRS + PostGIS ST_Covers + Redis Pub/Sub E2E Verification
        run: python scripts/verify_stack.py

      - name: Tear down Docker stack
        if: always()
        run: docker compose down -v
