worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    client_max_body_size 12m;

    upstream backend_sync {
        server backend-sync:8000;
    }

    upstream backend_read {
        server backend-read:8000;
    }

    # True HTTP-method CQRS routing: all mutating API requests -> backend_sync; GET/HEAD/OPTIONS -> backend_read
    map $request_method $cqrs_api_upstream {
        default backend_read;
        POST    backend_sync;
        PUT     backend_sync;
        PATCH   backend_sync;
        DELETE  backend_sync;
    }

    server {
        listen 8000;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Realtime WebSocket Plane -> backend-read (bridged from backend-sync via Redis Pub/Sub) ──
        location /api/v1/ws/ {
            proxy_pass http://backend_read;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP "";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Auth logout mutates users.token_version -> backend-sync (true CQRS write safety) ──
        location = /api/v1/auth/logout {
            proxy_pass http://backend_sync;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP "";
            proxy_read_timeout 30s;
        }

        # ── Auth read/token minting -> backend-read (fast login & ws-ticket without sync contention) ──
        location /api/v1/auth/ {
            proxy_pass http://backend_read;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP "";
            proxy_read_timeout 30s;
        }

        # ── CQRS Split API: Mutations -> backend-sync (120s), Queries -> backend-read (60s) ──
        location /api/v1/ {
            proxy_pass http://$cqrs_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP "";
            proxy_read_timeout 120s;
            proxy_connect_timeout 30s;
        }

        # ── Compiled Vite Frontend + Manifest -> backend-read ──
        location / {
            proxy_pass http://backend_read;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP "";
            proxy_read_timeout 60s;
            proxy_connect_timeout 15s;
        }
    }
}
