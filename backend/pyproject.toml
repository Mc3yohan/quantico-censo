[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantico-censo-backend"
version = "1.0.0"
description = "Quantico Censo — Geospatial Retail Census, Offline-First PWA Sync & Multi-Tenant Field Operations Platform"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Víctor Yohan Betancourt Marín — Quantico Systems" }
]
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "sqlalchemy>=2.0.35,<3.0.0",
  "alembic>=1.14.0,<2.0.0",
  "geoalchemy2>=0.15.2,<1.0.0",
  "shapely>=2.0.6,<3.0.0",
  "psycopg[binary]>=3.2.3,<4.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "PyJWT>=2.9.0,<3.0.0",
  "bcrypt>=4.2.0,<5.0.0",
  "redis>=5.2.0,<6.0.0",
  "python-multipart>=0.0.12,<1.0.0",
  "Pillow>=11.0.0,<12.0.0",
  "structlog>=24.4.0,<25.0.0",
  "slowapi>=0.1.9,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.2",
  "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"
